name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python-and-extensions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Check Python compilation & JS syntax
        run: |
          python -m compileall -q source extensions
          node --check extensions/core/quota_engine.js
          node --check extensions/core/swarm_bridge.js
          node --check extensions/core/error_guardian.js
          node --check extensions/desktop/ag_desktop_ui.js
          node --check extensions/desktop/ipcHandlers.js
          node --check extensions/ide/extension.js

      - name: Run pytest suite
        run: pytest tests -q
